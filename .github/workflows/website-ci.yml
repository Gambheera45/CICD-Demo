name: Website CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Stage
        run: |
          mkdir build
          cp index.html build/

      - name: Test Stage
        run: |
          test -f build/index.html

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/

      - name: Success
        run: |
          echo "Build completed successfully!"
