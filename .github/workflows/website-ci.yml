name: Website CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Stage
        run: |
          echo "Building website..."
          ls -la

      - name: Test Stage
        run: |
          echo "Testing website..."
          test -f index.html

      - name: Package Stage
        run: |
          mkdir output
          cp index.html output/

      - name: Deploy Stage
        run: |
          echo "Deploying application..."

      - name: Success
        run: |
          echo "CI/CD Pipeline completed successfully!"
