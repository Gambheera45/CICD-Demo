name: Website CI-CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir build
          cp index.html build/

      - name: Test
        run: |
          test -f build/index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Deploy to Dev
        run: |
          echo "Deploying to DEV environment"

  deploy-production:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to PRODUCTION environment"
